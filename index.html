<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mi cuerpo mágico · Juego infantil</title><style>
:root{font-family:system-ui,'Segoe UI',sans-serif;color:#263e59;background:#f2f9ff}*{box-sizing:border-box}body{margin:0}.app{max-width:1050px;margin:auto;padding:16px}header{text-align:center}h1{font-size:clamp(26px,4vw,42px);margin:4px;color:#2362a0}p{margin:6px}.toolbar{display:flex;justify-content:center;flex-wrap:wrap;gap:9px;margin:14px 0}button{font:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:4px solid #f5a623;outline-offset:2px}.pill{border:2px solid #aac7e0;border-radius:22px;padding:11px 15px;background:white;font-weight:750}.pill.active{background:#236fbb;color:white;border-color:#236fbb}.main{display:grid;grid-template-columns:minmax(250px,1fr) minmax(300px,1.2fr);gap:16px}.panel{border:3px solid #d9ebf5;border-radius:26px;background:white;padding:14px}.organs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.organ{touch-action:manipulation;min-height:116px;border:4px solid #d6e5ee;border-radius:22px;background:#fff;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:2px}.organ svg{width:76px;height:65px}.organ.selected{border-color:#f4b52c;background:#fff8dc}.organ.done{border-color:#78cba1;background:#e7faef}.organ span{font-size:13px;font-weight:800}.organ .check{color:#198a54}.bodypanel{background:linear-gradient(#e6f7ff,#e8f9ef);text-align:center}.bodypanel svg{width:100%;max-width:410px;max-height:550px}.target{fill:#fff9;stroke:#3684a6;stroke-width:2.5;stroke-dasharray:6 5;cursor:pointer;touch-action:manipulation}.target.complete{fill:#e3ffe9;stroke:#29965c;stroke-dasharray:none}.target:focus{outline:none;stroke:#f59e0b;stroke-width:5}.placed{pointer-events:none}.status{background:#fff3d6;border-radius:20px;padding:14px;min-height:68px;text-align:center;font-weight:800;font-size:clamp(17px,2.4vw,24px)}.controls{display:flex;flex-wrap:wrap;justify-content:center;gap:9px;margin:12px}.action{border:0;background:#2675bf;color:white;padding:13px 19px;border-radius:18px;font-weight:850;font-size:18px}.action.secondary{background:#fff;color:#235d91;border:2px solid #91b5d6}.hint{text-align:center;color:#536b7a;font-size:13px}.progress{text-align:center;font-size:20px;font-weight:800;margin:8px}footer{text-align:center;color:#667b88;font-size:13px;padding:15px}@media(max-width:700px){.main{grid-template-columns:1fr}.organ{min-height:92px}.organ svg{width:65px;height:55px}.bodypanel svg{max-height:480px}}
</style></head><body><div class="app"><header><h1>🌈 Mi cuerpo mágico</h1><p>¡Descubre qué hay dentro de ti!</p></header><div class="toolbar"><button class="pill active" id="solo">🔊 Juego solo</button><button class="pill" id="group">👩‍🏫 Asamblea</button><button class="pill active" id="easy">🌱 4 partes</button><button class="pill" id="hard">🌟 8 partes</button></div><div class="status" id="status" aria-live="polite">¡Toca un dibujo y busca su lugar en el muñeco!</div><div class="controls"><button class="action" id="listen">🔊 Escuchar</button><button class="action secondary" id="reset">↻ Empezar otra vez</button><button class="action secondary" id="next">▶ Siguiente</button></div><div class="progress" id="progress">⭐ 0 / 4</div><div class="main"><section class="panel"><div class="organs" id="organs"></div><p class="hint">Toca un dibujo y después su lugar en el muñeco.</p></section><section class="panel bodypanel"><svg id="person" viewBox="0 0 360 520" role="group" aria-label="Muñeco con zonas para colocar partes del cuerpo"><defs><linearGradient id="shirt" x2="0" y2="1"><stop stop-color="#ffe08a"/><stop offset="1" stop-color="#f7b960"/></linearGradient></defs><ellipse cx="180" cy="502" rx="96" ry="10" fill="#aed8c4" opacity=".6"/><path d="M143 384 L141 467 Q140 484 157 485 Q173 484 174 470 L178 393 M217 384 L220 467 Q220 484 203 485 Q187 484 186 470 L182 393" fill="#eab18b" stroke="#bd825e" stroke-width="3"/><path d="M142 467 Q117 475 121 489 Q124 498 166 496 Q180 493 173 476 M219 467 Q243 475 239 489 Q236 498 194 496 Q180 493 187 476" fill="#6c9dd4" stroke="#4d76a5" stroke-width="3"/><path d="M126 201 Q91 201 83 235 L56 335 Q51 353 68 356 Q81 358 87 342 L120 273 M234 201 Q269 201 277 235 L304 335 Q309 353 292 356 Q279 358 273 342 L240 273" fill="#eab18b" stroke="#bd825e" stroke-width="3"/><path d="M162 177 V201 H198 V177" fill="#eab18b" stroke="#bd825e" stroke-width="3"/><path d="M128 205 Q148 195 180 198 Q212 195 232 205 L244 375 Q226 403 180 405 Q134 403 116 375Z" fill="url(#shirt)" stroke="#dba04b" stroke-width="3"/><path d="M122 368 Q180 388 238 368 L240 405 Q180 425 120 405Z" fill="#69a7db" stroke="#497faf" stroke-width="3"/><ellipse cx="180" cy="112" rx="77" ry="91" fill="#f1bf9d" stroke="#bd825e" stroke-width="3"/><ellipse cx="103" cy="121" rx="12" ry="20" fill="#f1bf9d" stroke="#bd825e" stroke-width="2"/><ellipse cx="257" cy="121" rx="12" ry="20" fill="#f1bf9d" stroke="#bd825e" stroke-width="2"/><path d="M104 103 Q92 13 174 15 Q259 10 257 106 Q241 87 232 60 Q195 91 111 83Z" fill="#6d4835"/><path d="M136 110 Q150 100 163 110 M198 110 Q211 100 224 110" fill="none" stroke="#6d4835" stroke-width="4" stroke-linecap="round"/><circle cx="151" cy="116" r="5" fill="#44312a"/><circle cx="209" cy="116" r="5" fill="#44312a"/><circle cx="153" cy="114" r="1.6" fill="white"/><circle cx="211" cy="114" r="1.6" fill="white"/><path d="M178 127 Q172 142 182 141" fill="none" stroke="#c58b6b" stroke-width="2.5"/><path d="M160 153 Q180 174 200 153" fill="none" stroke="#bd5860" stroke-width="4" stroke-linecap="round"/><circle cx="131" cy="145" r="12" fill="#e9908f" opacity=".35"/><circle cx="229" cy="145" r="12" fill="#e9908f" opacity=".35"/><g id="targets"></g><g id="placed"></g></svg></section></div><footer>Actividad de Educación Infantil · Los sonidos dependen de las voces instaladas en el dispositivo.</footer></div>
<script>
(()=>{const NS='http://www.w3.org/2000/svg';const all=[{id:'brain',name:'Cerebro',x:180,y:67,rx:37,ry:23,voice:'Busca la cabeza. ¿Dónde vive el cerebro?',fact:'¡Muy bien! El cerebro nos ayuda a pensar.'},{id:'eyes',name:'Ojos',x:180,y:115,rx:53,ry:17,voice:'¿Dónde están los ojos? ¡Nos ayudan a ver!',fact:'¡Genial! Con los ojos podemos ver.'},{id:'ears',name:'Orejas',x:252,y:129,rx:19,ry:26,voice:'¿Dónde están las orejas? ¡Escuchamos con ellas!',fact:'¡Bravo! Las orejas nos ayudan a oír.'},{id:'lungs',name:'Pulmones',x:172,y:250,rx:39,ry:27,voice:'Respira despacito. ¿Dónde están los pulmones?',fact:'¡Muy bien! Los pulmones nos ayudan a respirar.'},{id:'heart',name:'Corazón',x:217,y:303,rx:23,ry:22,voice:'Pum, pum. ¿Dónde está el corazón?',fact:'¡Estupendo! El corazón mueve la sangre.'},{id:'stomach',name:'Estómago',x:169,y:353,rx:26,ry:23,voice:'¿Dónde está el estómago? Está en la barriga.',fact:'¡Sí! El estómago ayuda a digerir la comida.'},{id:'bones',name:'Huesos',x:152,y:443,rx:24,ry:31,voice:'¿Dónde tenemos huesos? Busca la pierna.',fact:'¡Bravo! Los huesos sostienen nuestro cuerpo.'},{id:'muscles',name:'Músculos',x:87,y:273,rx:23,ry:30,voice:'¿Dónde están los músculos? Busca el brazo.',fact:'¡Genial! Los músculos nos ayudan a movernos.'}];const easy=['brain','lungs','heart','stomach'];let level=4,mode='solo',selected='brain',done=new Set(),last='',startPointer=null;const $=id=>document.getElementById(id);const shape={brain:'<path d="M32 12 C21 5 10 14 13 26 C4 32 10 44 20 44 C21 56 30 56 32 48 C35 56 45 54 46 44 C57 43 60 30 51 25 C53 14 43 6 32 12Z" fill="#f5a0bc" stroke="#ba5b86" stroke-width="2.7"/><path d="M32 13V48 M21 17Q29 21 22 29 M15 35Q25 30 27 40 M43 17Q36 22 43 30 M49 35Q40 31 37 40" fill="none" stroke="#ba5b86" stroke-width="2.5"/>',eyes:'<ellipse cx="20" cy="32" rx="14" ry="19" fill="white" stroke="#5984aa" stroke-width="3"/><ellipse cx="44" cy="32" rx="14" ry="19" fill="white" stroke="#5984aa" stroke-width="3"/><circle cx="22" cy="33" r="8" fill="#63b4b7"/><circle cx="42" cy="33" r="8" fill="#63b4b7"/><circle cx="22" cy="33" r="4" fill="#293c51"/><circle cx="42" cy="33" r="4" fill="#293c51"/>',ears:'<path d="M35 8 C12 3 9 28 17 40 C25 51 24 58 36 55 C44 52 40 41 45 33 C54 18 47 9 35 8Z" fill="#edb08e" stroke="#b97861" stroke-width="3"/><path d="M34 20 C23 16 20 34 30 37 C37 40 27 46 35 47" fill="none" stroke="#b97861" stroke-width="3"/>',lungs:'<path d="M30 8V29 M34 8V29 M30 20L21 29 M34 20L43 29" fill="none" stroke="#78a8c4" stroke-width="5" stroke-linecap="round"/><path d="M24 23 C12 19 5 38 10 50 C13 60 29 56 29 45 L29 27Z M40 23 C52 19 59 38 54 50 C51 60 35 56 35 45 L35 27Z" fill="#f3a5af" stroke="#b9697d" stroke-width="2.5"/>',heart:'<path d="M32 55 C23 47 8 35 8 22 C8 8 26 7 32 20 C38 7 56 8 56 22 C56 35 41 47 32 55Z" fill="#ef536b" stroke="#a62f4a" stroke-width="3"/><path d="M20 19Q16 22 17 27" fill="none" stroke="#ffb6c2" stroke-width="4"/>',stomach:'<path d="M27 7V24 Q27 32 40 31 Q52 31 50 45 Q47 59 30 56 Q12 53 13 39 Q13 28 24 26" fill="#f3c76b" stroke="#b8843c" stroke-width="3"/><path d="M23 42Q32 48 41 40" fill="none" stroke="#d9a452" stroke-width="3"/>',bones:'<path d="M17 16 Q9 6 6 17 Q5 26 14 26 L39 49 Q39 58 49 57 Q60 56 55 46 Q50 41 44 43 L21 20 Q25 12 17 16Z" fill="#fff8e4" stroke="#b1a790" stroke-width="3"/>',muscles:'<path d="M12 49 Q12 34 25 31 L30 17 Q36 9 42 15 L43 31 Q56 32 56 43 Q56 56 41 56 H23 Q14 56 12 49Z" fill="#ec8b7d" stroke="#ae5657" stroke-width="3"/><path d="M25 44 Q36 32 48 43" fill="none" stroke="#b95359" stroke-width="3"/>'};function icon(id){let s=document.createElementNS(NS,'svg');s.setAttribute('viewBox','0 0 64 64');s.setAttribute('width','64');s.setAttribute('height','64');s.innerHTML=shape[id];return s}function active(){return all.filter(o=>level===8||easy.includes(o.id))}function speak(t){if(!('speechSynthesis'in window))return;window.speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='es-ES';u.rate=.83;u.pitch=1.08;window.speechSynthesis.speak(u)}function say(t,audio=true){last=t;$('status').textContent=t;if(audio)speak(t)}function render(){let list=active();$('organs').replaceChildren();list.forEach(o=>{let b=document.createElement('button');b.className='organ'+(selected===o.id?' selected':'')+(done.has(o.id)?' done':'');b.setAttribute('aria-label',o.name);b.append(icon(o.id));let label=document.createElement('span');label.textContent=done.has(o.id)?'✓':'●';label.style.color=done.has(o.id)?'#29965c':'#d69b28';b.append(label);b.addEventListener('click',()=>{if(done.has(o.id))return;selected=o.id;render();say(mode==='solo'?o.voice:'¿Dónde va?')});$('organs').append(b)});$('targets').replaceChildren();$('placed').replaceChildren();list.forEach(o=>{let el=document.createElementNS(NS,'ellipse');el.setAttribute('cx',o.x);el.setAttribute('cy',o.y);el.setAttribute('rx',o.rx);el.setAttribute('ry',o.ry);el.setAttribute('class','target'+(done.has(o.id)?' complete':''));el.dataset.zone=o.id;el.setAttribute('role','button');el.setAttribute('tabindex','0');el.setAttribute('aria-label','Lugar para '+o.name);el.addEventListener('click',()=>attempt(o.id));el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();attempt(o.id)}});$('targets').append(el);if(done.has(o.id)){let g=document.createElementNS(NS,'g');g.setAttribute('transform',`translate(${o.x-21},${o.y-21}) scale(.65)`);g.setAttribute('class','placed');g.append(icon(o.id));$('placed').append(g)}});$('progress').textContent='⭐ '+done.size+' / '+list.length;$('next').style.display=mode==='group'?'inline-block':'none'}function attempt(id){if(done.has(selected))return;let o=all.find(x=>x.id===selected);if(id!==selected){say('¡Casi! Toca otro círculo del muñeco.');return}done.add(id);if(done.size===active().length){say('¡Enhorabuena! ¡Has completado el cuerpo! ¡Choca esos cinco!')}else{say(o.fact);if(mode==='solo'){selected=active().find(x=>!done.has(x.id)).id}}render()}function restart(){done.clear();selected=active()[0].id;render();say('¡Empezamos! '+(mode==='solo'?active()[0].voice:'¿Dónde colocamos el primer órgano?'))}function setMode(m){mode=m;$('solo').classList.toggle('active',m==='solo');$('group').classList.toggle('active',m==='group');render();say(m==='solo'?'¡Vamos a jugar! '+all.find(o=>o.id===selected).voice:'¡Jugamos todos juntos! Toca un órgano y después toca su lugar en el muñeco.')}function setLevel(n){level=n;$('easy').classList.toggle('active',n===4);$('hard').classList.toggle('active',n===8);restart()}$('solo').onclick=()=>setMode('solo');$('group').onclick=()=>setMode('group');$('easy').onclick=()=>setLevel(4);$('hard').onclick=()=>setLevel(8);$('listen').onclick=()=>speak(last);$('reset').onclick=restart;$('next').onclick=()=>{let n=active().find(x=>!done.has(x.id));if(n){selected=n.id;render();say(n.voice)}else say('¡Todos los órganos están colocados!')};render();say('¡Hola! Pulsa el altavoz. Toca un órgano y luego su lugar en el muñeco.',false)})();
</script></body></html>
